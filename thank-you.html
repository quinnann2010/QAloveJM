
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Letter Delivered ♡ | Loveverse</title>

  <style>
    :root {
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;

      background:
        radial-gradient(
          circle at 15% 20%,
          #fff 0,
          transparent 35%
        ),
        linear-gradient(
          145deg,
          #fff0f4,
          #ffe3ec 60%,
          #f5eaff
        );

      color: #674359;
      font-family: 'Trebuchet MS', Arial, sans-serif;
    }

    main {
      width: min(100%, 510px);
      padding: 50px 30px;
      text-align: center;

      background: #ffffffd9;
      border: 2px solid #fff;
      border-radius: 28px;

      box-shadow: 0 18px 50px #bf779a30;
    }

    .envelope {
      font-size: 78px;
      animation: float 2.8s ease-in-out infinite;
    }

    h1 {
      font-size: clamp(27px, 5vw, 39px);
      margin: 18px 0;
    }

    p {
      font-size: 17px;
      line-height: 1.7;
    }

    a {
      display: inline-block;
      margin-top: 20px;
      padding: 15px 24px;

      border-radius: 999px;
      background: #db88a9;
      color: #fff;

      text-decoration: none;
      font-weight: 700;
    }

    a:hover {
      background: #c36b90;
    }

    .small {
      font-size: 13px;
      color: #967488;
    }

    @keyframes float {
      50% {
        transform: translateY(-12px) rotate(-5deg);
      }
    }
  </style>
</head>

<body>
  <main>

    <div class="envelope" aria-hidden="true">
      💌
    </div>

    <h1>
      Your letter is on its way! ♡
    </h1>

    <p>
      Your little love letter has been handed
      to our tiny post office.
      Your girl will be smiling very soon. 💗
    </p>

    <p class="small">
      Thank you for sending a little piece
      of your heart.
    </p>

    <a href="./index.html">
      ← Back to our Loveverse
    </a>

  </main>
</body>
</html>
